# TMC2209 moved without STEP/DIR: velocity commands over UART (VACTUAL), position counted on INDEX.
# Positioning is less exact than with STEP/DIR (see README); use it when STEP/DIR cannot be wired.
esphome:
  name: tmc2209-uart-control

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: ../components
  # - source: github://ShadyMCShadesen/esphome-tmc22xx@main
  #   components: [tmc22xx]

uart:
  id: tmc_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

tmc22xx:
  - id: motor
    driver: tmc2209
    mode: uart
    control: uart
    # STEP/DIR of the driver must not float: tie them to GND, or if they are wired to the ESP list
    # them here so they are held low.
    #step_pin: GPIO25
    #dir_pin: GPIO26
    uart_id: tmc_uart
    index_pin: GPIO35           # INDEX output of the driver
    diag_pin: GPIO34
    enable_pin:                 # recommended here: last resort if the driver stops answering
      number: GPIO27
      inverted: true
    run_current: 600mA
    hold_current: 300mA
    microsteps: 8
    stallguard_threshold: 60
    max_speed: 2000             # steps/s
    acceleration: 4000
    creep_speed: 100            # start speed and final approach, default 100 steps/s
    homing:
      source: stallguard
      direction: negative
      speed: 1500
      backoff: 100
      max_travel: 50000

sensor:
  - platform: tmc22xx
    tmc22xx_id: motor
    position:
      name: "Position"

button:
  - platform: tmc22xx
    tmc22xx_id: motor
    home:
      name: "Home"
    stop:
      name: "Stop"
  - platform: template
    name: "Forward 400"
    on_press:
      - tmc22xx.move_by:
          id: motor
          distance: 400
